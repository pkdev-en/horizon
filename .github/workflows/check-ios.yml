name: iOS Compile Check

on:
  push:
    branches: [ios-port]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-check

      - name: Dump Cargo.tomls
        run: |
          echo "=== WORKSPACE ===" && cat Cargo.toml
          echo ""
          echo "=== horizon-client ==="
          find . -path "*/horizon-client/Cargo.toml" -not -path "*/target/*" | xargs cat
          echo ""
          echo "=== ALL CRATES ==="
          find . -name "Cargo.toml" -not -path "*/target/*" | sort | xargs -I{} sh -c 'echo "--- {} ---" && cat {}'
        continue-on-error: true

      - name: Dump Cargo.tomls to file
        run: |
          {
            echo "=== WORKSPACE ==="
            cat Cargo.toml
            echo ""
            echo "=== horizon-client ==="
            find . -path "*/horizon-client/Cargo.toml" -not -path "*/target/*" | xargs cat
            echo ""
            echo "=== ALL CRATES ==="
            find . -name "Cargo.toml" -not -path "*/target/*" | sort | xargs -I{} sh -c 'echo "--- {} ---" && cat {}'
          } > cargo-tomls.txt 2>&1

      - name: cargo check for iOS
        run: |
          cargo check \
            --target aarch64-apple-ios \
            -p horizon-client \
            2>&1 | tee compile-errors.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: compile-errors
          path: |
            compile-errors.txt
            cargo-tomls.txt
