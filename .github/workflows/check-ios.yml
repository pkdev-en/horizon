name: iOS Compile Check

on:
  push:
    branches: [ios-port]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-check

      - name: cargo check for iOS
        run: |
          cargo check \
            --target aarch64-apple-ios \
            -p horizon-client \
            --no-default-features \
            --features "metal" \
            2>&1 | tee compile-errors.txt || true

      - name: Dump horizon-client Cargo.toml
        run: |
          cat crates/horizon-client/Cargo.toml 2>/dev/null \
            || find . -name "Cargo.toml" | xargs grep -l "horizon-client" | head -5
            # Cũng dump workspace Cargo.toml
          cat Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: compile-errors
          path: compile-errors.txt
